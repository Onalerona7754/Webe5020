<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry Form - Hope Haven</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Hope Haven Animal Shelter</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services & Animals</a></li>
                <li><a href="enquiry.html" class="active">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2 class="section-title">Volunteer & Sponsorship Application</h2>
        <div class="form-container">
            <form action="#" method="post">
                <div class="form-group">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="type">Inquiry Type:</label>
                    <select id="type" name="type" required>
                        <option value="volunteer">Volunteer Application</option>
                        <option value="sponsorship">Corporate Sponsorship</option>
                        <option value="adoption">General Adoption Inquiry</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="message">Message details:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn">Submit Application</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Hope Haven Animal Shelter. All Rights Reserved.</p>
    </footer>
</body>
</html>
